name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  quality:
    name: Quality checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 22.x and 23.x are the required checks on main; 26.8.2 is the
        # .nvmrc version the release workflow builds and publishes with.
        node-version: ['22.x', '23.x', '26.8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js with Volta
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Pack each package (smoke test)
        run: |
          mkdir -p .tarballs
          for pkg in packages/*/; do
            name=$(node -p "require('./${pkg}package.json').name")
            echo "::group::npm pack $name"
            npm pack -w "$name" --pack-destination .tarballs
            echo "::endgroup::"
          done
          ls -la .tarballs/
